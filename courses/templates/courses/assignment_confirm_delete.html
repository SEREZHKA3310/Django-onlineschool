{% extends "courses/base.html" %}

{% block title %}Удалить задание{% endblock %}

{% block content %}
<div class="confirm-card">
    <h1>Удалить задание?</h1>
    <p>Задание «<strong>{{ assignment.name }}</strong>» и все решения будут удалены.</p>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'course_detail' assignment.lesson.course_id %}" class="btn btn-outline">Отмена</a>
    </form>
</div>
{% endblock %}
