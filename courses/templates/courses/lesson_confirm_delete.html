{% extends "courses/base.html" %}

{% block title %}Удалить урок{% endblock %}

{% block content %}
<div class="confirm-card">
    <h1>Удалить урок?</h1>
    <p>Урок «<strong>{{ lesson.name }}</strong>» и все задания будут удалены.</p>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'course_detail' lesson.course_id %}" class="btn btn-outline">Отмена</a>
    </form>
</div>
{% endblock %}
